[pytest]
addopts = -ra --strict-markers
pythonpath = .
python_files = test_*.py
norecursedirs = .git .venv __pycache__ data saved_models experiments/reports
markers =
    slow: longer-running tests excluded from the default CI unit phase
    integration: tests that cross module or process boundaries
    neo4j: opt-in tests that require a live Neo4j service
